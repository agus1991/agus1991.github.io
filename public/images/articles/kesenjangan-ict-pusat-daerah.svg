<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgICT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F7F4" />
      <stop offset="100%" stop-color="#E8E5DF" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgICT)" />
  <rect x="35" y="35" width="1130" height="560" rx="14" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="2" />
  
  <!-- Left Column: Title & Metadata -->
  <!-- Category Badge -->
  <rect x="80" y="85" width="250" height="34" rx="17" fill="#F1EDE4" stroke="#A58B62" stroke-width="1.2" />
  <text x="205" y="107" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#A58B62" text-anchor="middle" letter-spacing="1">TATA KELOLA SPBE</text>
  
  <!-- Main Title (Shortened & Two-line elegant) -->
  <text x="80" y="180" font-family="Lora, Georgia, serif" font-size="44" font-weight="700" fill="#252525">Kesenjangan TIK</text>
  <text x="80" y="235" font-family="Lora, Georgia, serif" font-size="44" font-weight="700" fill="#252525">Pusat dan Daerah</text>
  
  <!-- Subtitle -->
  <text x="80" y="295" font-family="Lora, Georgia, serif" font-size="24" font-weight="600" fill="#A58B62">Dilema Sistem Silo &amp; Interoperabilitas SPBE</text>
  
  <!-- Short Description -->
  <text x="80" y="350" font-family="Inter, sans-serif" font-size="16" fill="#777777">Kajian Disparitas Digital, Beban Aplikasi OPD,</text>
  <text x="80" y="378" font-family="Inter, sans-serif" font-size="16" fill="#777777">serta Solusi Arsitektur Jaringan dan REST API Terpadu</text>
  
  <!-- Right Column: Comparative Metric Card (Completely separated, no overlap) -->
  <g transform="translate(760, 95)">
    <!-- Card Container -->
    <rect x="0" y="0" width="340" height="320" rx="12" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5" />
    
    <!-- Card Header Banner -->
    <rect x="0" y="0" width="340" height="46" rx="12" fill="#F8F7F4" />
    <rect x="0" y="24" width="340" height="22" fill="#F8F7F4" />
    <line x1="0" y1="46" x2="340" y2="46" stroke="#E8E5DF" stroke-width="1.2" />
    <text x="170" y="29" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#252525" text-anchor="middle" letter-spacing="1">KOMPARASI INDEKS SPBE</text>
    
    <!-- Metric 1: Pusat -->
    <text x="25" y="85" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#252525">Pemerintah Pusat (K/L)</text>
    <text x="315" y="85" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#A58B62" text-anchor="end">3.82 / 5.0</text>
    <rect x="25" y="97" width="290" height="10" rx="5" fill="#E8E5DF" />
    <rect x="25" y="97" width="222" height="10" rx="5" fill="#A58B62" />
    <text x="25" y="125" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#777777">Predikat: Sangat Baik / Baik</text>
    
    <!-- Metric 2: Daerah -->
    <text x="25" y="165" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#252525">Pemerintah Daerah (Kab/Kota)</text>
    <text x="315" y="165" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#777777" text-anchor="end">2.41 / 5.0</text>
    <rect x="25" y="177" width="290" height="10" rx="5" fill="#E8E5DF" />
    <rect x="25" y="177" width="140" height="10" rx="5" fill="#9C978D" />
    <text x="25" y="205" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#777777">Predikat: Cukup / Kurang (&gt;65% Daerah)</text>
    
    <!-- Divider inside card -->
    <line x1="25" y1="230" x2="315" y2="230" stroke="#E8E5DF" stroke-dasharray="4,4" />
    
    <!-- Summary Alert inside Card -->
    <rect x="20" y="248" width="300" height="48" rx="8" fill="#F8F7F4" stroke="#E8E5DF" stroke-width="1" />
    <circle cx="38" cy="272" r="5" fill="#D97706" />
    <text x="52" y="268" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#92400E">Disparitas Kesenjangan: ~37%</text>
    <text x="52" y="284" font-family="Inter, sans-serif" font-size="10" fill="#777777">Tantangan: Sistem Silo &amp; Beban Aplikasi</text>
  </g>
  
  <!-- Footer Divider & Credits -->
  <line x1="80" y1="480" x2="1100" y2="480" stroke="#E8E5DF" stroke-width="1.5" />
  <text x="80" y="525" font-family="Inter, sans-serif" font-size="16" fill="#777777">MAS-AGUS Knowledge Hub • Agus Sifaunajah</text>
  <text x="1100" y="525" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#A58B62" text-anchor="end">agus1991.github.io</text>
</svg>
