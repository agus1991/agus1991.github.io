<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgCake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D33C43" />
      <stop offset="100%" stop-color="#9E1B22" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgCake)" />
  <rect x="40" y="40" width="1120" height="550" rx="12" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="2" />
  
  <!-- Category Badge -->
  <rect x="80" y="85" width="280" height="34" rx="17" fill="#FFF1F2" stroke="#D33C43" stroke-width="1.5" />
  <text x="220" y="107" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#BE123C" text-anchor="middle" letter-spacing="1">SOFTWARE ARCHITECTURE &amp; PHP</text>
  
  <!-- Title (Compact & Elegant) -->
  <text x="80" y="185" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#1C1917">Evolusi CakePHP</text>
  
  <!-- Subtitle (Two-line structured to guarantee no overlap with card at x=800) -->
  <text x="80" y="238" font-family="Lora, Georgia, serif" font-size="24" font-weight="600" fill="#9E1B22">Dari Pionir Konvensi Menuju</text>
  <text x="80" y="272" font-family="Lora, Georgia, serif" font-size="24" font-weight="600" fill="#9E1B22">Arsitektur Enterprise Modern</text>
  
  <!-- Description (Bounded to max x=600) -->
  <text x="80" y="325" font-family="Inter, sans-serif" font-size="16" fill="#57534E">Lintasan Transformasi v1 hingga v5+, Data Mapper ORM,</text>
  <text x="80" y="352" font-family="Inter, sans-serif" font-size="16" fill="#57534E">Disiplin Konvensi, dan Relevansinya di Industri</text>
  
  <!-- Illustration Badge Card (Strictly placed at x=800..1100, safe margin >240px) -->
  <g transform="translate(800, 105)">
    <rect width="300" height="320" rx="10" fill="#FFF8F8" stroke="#FECDD3" stroke-width="1.5" />
    
    <!-- Header Core Box -->
    <rect x="30" y="30" width="240" height="46" rx="8" fill="url(#cakeGrad)" />
    <text x="150" y="52" font-family="Lora, Georgia, serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">CakePHP Ecosystem</text>
    <text x="150" y="67" font-family="Inter, sans-serif" font-size="10" fill="#FFE4E6" text-anchor="middle">Convention over Configuration (CoC)</text>
    
    <!-- Flow Connector -->
    <line x1="150" y1="76" x2="150" y2="98" stroke="#D33C43" stroke-width="2" stroke-dasharray="3,3" />
    
    <!-- Layer 1: Data Mapper ORM -->
    <rect x="30" y="98" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#D33C43" stroke-width="1.2" />
    <text x="45" y="124" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#9E1B22">DATA MAPPER ORM</text>
    <text x="255" y="124" font-family="Inter, sans-serif" font-size="10" fill="#78716C" text-anchor="end">Table &amp; Entity</text>
    
    <!-- Flow Connector -->
    <line x1="150" y1="140" x2="150" y2="160" stroke="#D33C43" stroke-width="2" stroke-dasharray="3,3" />
    
    <!-- Layer 2: Bake CLI & Middleware -->
    <rect x="30" y="160" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#D33C43" stroke-width="1.2" />
    <text x="45" y="186" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#9E1B22">BAKE CLI &amp; PSR-15</text>
    <text x="255" y="186" font-family="Inter, sans-serif" font-size="10" fill="#78716C" text-anchor="end">Rapid Scaffolding</text>
    
    <!-- Flow Connector -->
    <line x1="150" y1="202" x2="150" y2="222" stroke="#D33C43" stroke-width="2" stroke-dasharray="3,3" />
    
    <!-- Layer 3: Security & PHP 8+ Modern -->
    <rect x="30" y="222" width="240" height="42" rx="6" fill="#FFF1F2" stroke="#D33C43" stroke-width="1.2" />
    <text x="45" y="248" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#881337">SECURITY &amp; TYPING</text>
    <text x="255" y="248" font-family="Inter, sans-serif" font-size="10" fill="#881337" text-anchor="end">Form Protection &amp; DI</text>
    
    <!-- Footer Attribution -->
    <text x="150" y="295" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#9E1B22" text-anchor="middle">Cake Software Foundation</text>
  </g>
  
  <!-- Bottom Bar -->
  <line x1="80" y1="470" x2="1100" y2="470" stroke="#E8E5DF" stroke-width="2" />
  <text x="80" y="520" font-family="Inter, sans-serif" font-size="16" fill="#78716C">MAS-AGUS Knowledge Hub • Agus Sifaunajah</text>
  <text x="1100" y="520" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#D33C43" text-anchor="end">agus1991.github.io</text>
</svg>