<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgVue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>
    <linearGradient id="vueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42B883" />
      <stop offset="100%" stop-color="#35495E" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgVue)" />
  <rect x="40" y="40" width="1120" height="550" rx="12" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="2" />
  
  <!-- Category Badge -->
  <rect x="80" y="85" width="280" height="34" rx="17" fill="#F0FDF4" stroke="#42B883" stroke-width="1.5" />
  <text x="220" y="107" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle" letter-spacing="1">FRONTEND FRAMEWORK &amp; JAVASCRIPT</text>
  
  <!-- Title (Compact & Elegant) -->
  <text x="80" y="185" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#1C1917">Evolusi Framework Vue.js</text>
  
  <!-- Subtitle (Two-line structured to guarantee no overlap with card at x=800) -->
  <text x="80" y="238" font-family="Lora, Georgia, serif" font-size="24" font-weight="600" fill="#15803D">Dari Proyek Kreatif Menuju</text>
  <text x="80" y="272" font-family="Lora, Georgia, serif" font-size="24" font-weight="600" fill="#15803D">Standar Antarmuka Reaktif Global</text>
  
  <!-- Description (Bounded to max x=600) -->
  <text x="80" y="325" font-family="Inter, sans-serif" font-size="16" fill="#57534E">Lintasan Transformasi v1–v3+, Composition API,</text>
  <text x="80" y="352" font-family="Inter, sans-serif" font-size="16" fill="#57534E">Revolusi Tooling Vite, dan Dinamika Komunitas</text>
  
  <!-- Illustration Badge Card (Strictly placed at x=800..1100, safe margin >220px) -->
  <g transform="translate(800, 105)">
    <rect width="300" height="320" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" />
    
    <!-- Header Core Box with Vue V-Shape -->
    <rect x="30" y="30" width="240" height="48" rx="8" fill="#35495E" />
    <text x="150" y="54" font-family="Lora, Georgia, serif" font-size="16" font-weight="700" fill="#42B883" text-anchor="middle">Vue.js Ecosystem</text>
    <text x="150" y="69" font-family="Inter, sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">Progressive JavaScript Framework</text>
    
    <!-- Flow Connector -->
    <line x1="150" y1="78" x2="150" y2="98" stroke="#42B883" stroke-width="2" stroke-dasharray="3,3" />
    
    <!-- Layer 1: Reactivity & Composition API -->
    <rect x="30" y="98" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#42B883" stroke-width="1.2" />
    <text x="45" y="124" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#15803D">COMPOSITION API</text>
    <text x="255" y="124" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="end">Proxy Reactivity</text>
    
    <!-- Flow Connector -->
    <line x1="150" y1="140" x2="150" y2="160" stroke="#42B883" stroke-width="2" stroke-dasharray="3,3" />
    
    <!-- Layer 2: Ecosystem Tooling (Vite & Pinia) -->
    <rect x="30" y="160" width="240" height="42" rx="6" fill="#FFFFFF" stroke="#42B883" stroke-width="1.2" />
    <text x="45" y="186" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#15803D">VITE &amp; PINIA</text>
    <text x="255" y="186" font-family="Inter, sans-serif" font-size="10" fill="#6B7280" text-anchor="end">Sub-millisecond HMR</text>
    
    <!-- Flow Connector -->
    <line x1="150" y1="202" x2="150" y2="222" stroke="#42B883" stroke-width="2" stroke-dasharray="3,3" />
    
    <!-- Layer 3: Modern Fullstack & Vapor Mode -->
    <rect x="30" y="222" width="240" height="42" rx="6" fill="#DCFCE7" stroke="#42B883" stroke-width="1.2" />
    <text x="45" y="248" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#166534">VAPOR &amp; FULLSTACK</text>
    <text x="255" y="248" font-family="Inter, sans-serif" font-size="10" fill="#166534" text-anchor="end">No-VDOM / Nuxt</text>
    
    <!-- Footer Attribution -->
    <text x="150" y="295" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#35495E" text-anchor="middle">Evan You &amp; Global Community</text>
  </g>
  
  <!-- Bottom Bar -->
  <line x1="80" y1="470" x2="1100" y2="470" stroke="#E8E5DF" stroke-width="2" />
  <text x="80" y="520" font-family="Inter, sans-serif" font-size="16" fill="#78716C">MAS-AGUS Knowledge Hub • Agus Sifaunajah</text>
  <text x="1100" y="520" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#15803D" text-anchor="end">agus1991.github.io</text>
</svg>