<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Angular Red / Crimson Gradient -->
    <linearGradient id="angularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#DD0031"/>
      <stop offset="100%" stop-color="#C3002F"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DD0031" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="redGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#DD0031" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#redGlow)"/>

  <!-- Left Column: Title & Text Content (Strictly x=80..600) -->
  <g id="text-content">
    <!-- Category Badge -->
    <rect x="80" y="85" width="180" height="32" rx="16" fill="#DD0031" fill-opacity="0.2" stroke="#DD0031" stroke-opacity="0.6" stroke-width="1"/>
    <text x="170" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FDA4AF" text-anchor="middle" letter-spacing="1.5">FRONTEND ARCHITECTURE</text>

    <!-- Main Title (Strictly bounded) -->
    <text x="80" y="175" font-family="'Georgia', serif" font-size="38" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">Evolusi Framework Angular</text>

    <!-- Subtitle Line 1 (max 35 chars, <= 600px) -->
    <text x="80" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">Dari Pelopor $scope Hingga</text>

    <!-- Subtitle Line 2 (max 35 chars, <= 600px) -->
    <text x="80" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">Arsitektur Signals &amp; Enterprise</text>

    <!-- Divider Line -->
    <line x1="80" y1="315" x2="520" y2="315" stroke="#334155" stroke-width="1.5"/>

    <!-- Metadata Section -->
    <text x="80" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Agus Sifaunajah (MAS-AGUS)</text>
    <text x="80" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#64748B">Kajian Kepakaran Praktisi &amp; Arsitektur Rekayasa Web</text>

    <!-- Tags Row -->
    <g transform="translate(80, 520)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="100" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="50" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">AngularJS</text>

      <!-- Tag 2 -->
      <rect x="110" y="0" width="105" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="162" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">TypeScript</text>

      <!-- Tag 3 -->
      <rect x="225" y="0" width="95" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="272" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Signals</text>

      <!-- Tag 4 -->
      <rect x="330" y="0" width="100" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="380" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Enterprise</text>
    </g>
  </g>

  <!-- Right Column: Visual Architecture Card (Placed at translate(800, 105)) -->
  <g transform="translate(800, 105)">
    <!-- Main Card Body -->
    <rect width="300" height="420" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5"/>

    <!-- Card Header / Title -->
    <rect x="20" y="20" width="260" height="36" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="150" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">ANGULAR ROADMAP</text>

    <!-- Angular Shield Icon Graphic -->
    <g transform="translate(150, 115)">
      <!-- Outer Hex/Shield Glow -->
      <polygon points="0,-45 42,-22 42,22 0,45 -42,22 -42,-22" fill="#DD0031" fill-opacity="0.15"/>
      <!-- Shield Base -->
      <path d="M 0,-40 L 38,-20 L 31,25 L 0,40 L -31,25 L -38,-20 Z" fill="url(#angularGrad)"/>
      <!-- Inner Letter A Stylized -->
      <path d="M 0,-26 L 20,20 L 11,20 L 6,8 L -6,8 L -11,20 L -20,20 Z M 0,-12 L -4,3 L 4,3 Z" fill="#FFFFFF"/>
    </g>

    <!-- Phase 1: AngularJS 1.x -->
    <g transform="translate(25, 185)">
      <rect width="250" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="30" r="12" fill="#64748B" fill-opacity="0.2"/>
      <text x="24" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">v1</text>
      <text x="48" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">AngularJS (2010–2015)</text>
      <text x="48" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">$scope &amp; Two-Way Binding</text>
    </g>

    <!-- Phase 2: Angular 2+ Ivy -->
    <g transform="translate(25, 258)">
      <rect width="250" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="30" r="12" fill="#3B82F6" fill-opacity="0.2"/>
      <text x="24" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">v2+</text>
      <text x="48" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Angular v2–v16</text>
      <text x="48" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">TypeScript, Ivy &amp; RxJS CLI</text>
    </g>

    <!-- Phase 3: Angular Renaissance (Signals) -->
    <g transform="translate(25, 331)">
      <rect width="250" height="65" rx="8" fill="#1E293B" stroke="#DD0031" stroke-width="1.5"/>
      <circle cx="24" cy="32" r="12" fill="#DD0031" fill-opacity="0.3"/>
      <text x="24" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FDA4AF" text-anchor="middle">v17+</text>
      <text x="48" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FDA4AF">Angular Renaissance</text>
      <text x="48" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E2E8F0">Signals, Standalone &amp; @defer</text>
    </g>
  </g>
</svg>
