  <text x="80" y="238" font-family="Lora, Georgia, serif" font-size="24" font-weight="600" fill="#78350F">Refleksi Kritis atas Ketahanan</text>
  <text x="80" y="272" font-family="Lora, Georgia, serif" font-size="24" font-weight="600" fill="#78350F">Infrastruktur Digital Nasional</text>
  
  <!-- Description (Bounded to max x=600) -->
  <text x="80" y="325" font-family="Inter, sans-serif" font-size="16" fill="#57534E">Catatan Praktisi Jaringan: Meninjau Ransomware,</text>
  <text x="80" y="352" font-family="Inter, sans-serif" font-size="16" fill="#57534E">Budaya Keamanan, dan Kesiapan SPBE di Daerah</text>
  
  <!-- Cyber Defense Graphic Card (Strictly placed at x=800..1100, safe margin >250px) -->
  <g transform="translate(800, 105)">
    <rect width="300" height="320" rx="10" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1.5" />
    
    <!-- Shield Icon -->
    <path d="M150 40 L220 75 V140 C220 185 185 220 150 235 C115 220 80 185 80 140 V75 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5" />
    <path d="M150 85 V185" stroke="#B45309" stroke-width="2.5" stroke-dasharray="4,3" />
    <circle cx="150" cy="135" r="18" fill="#FFFFFF" stroke="#9A3412" stroke-width="2" />
    <text x="150" y="140" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#9A3412" text-anchor="middle">!</text>
    
    <text x="150" y="265" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1C1917" text-anchor="middle">Zero Trust &amp; Defense-in-Depth</text>
    <text x="150" y="288" font-family="Inter, sans-serif" font-size="11" fill="#78716C" text-anchor="middle">Air-Gapped Backup • Strict Isolation</text>
  </g>
  
  <!-- Bottom Bar -->
  <line x1="80" y1="470" x2="1100" y2="470" stroke="#E8E5DF" stroke-width="2" />
  <text x="80" y="520" font-family="Inter, sans-serif" font-size="16" fill="#78716C">MAS-AGUS Knowledge Hub • Agus Sifaunajah</text>
  <text x="1100" y="520" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#9A3412" text-anchor="end">agus1991.github.io</text>
