      <stop offset="0%" stop-color="#F8F7F4" />
      <stop offset="100%" stop-color="#EDE9E1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgCyber)" />
  <rect x="40" y="40" width="1120" height="550" rx="12" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="2" />
  
  <!-- Category Badge -->
  <rect x="80" y="85" width="230" height="34" rx="17" fill="#F4EFE6" stroke="#9A3412" stroke-width="1.5" />
  <text x="195" y="107" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#9A3412" text-anchor="middle" letter-spacing="1">OPINI &amp; KEAMANAN SIBER</text>
  
  <!-- Title (Compact & Elegant) -->
  <text x="80" y="185" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#1C1917">Menghadapi Badai Siber</text>
  
