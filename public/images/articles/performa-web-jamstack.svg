<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgPW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F7F4" />
      <stop offset="100%" stop-color="#EDE9E1" />
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgPW)" />
  <rect x="40" y="40" width="1120" height="550" rx="12" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="2" />
  
  <!-- Category Badge -->
  <rect x="80" y="85" width="280" height="34" rx="17" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" />
  <text x="220" y="107" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" letter-spacing="1">WEB PERFORMANCE &amp; ARCHITECTURE</text>
  
  <!-- Title & Subtitle (strictly bounded to x=80..680) -->
  <text x="80" y="190" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#1C1917">Optimasi Performa Web</text>
  <text x="80" y="245" font-family="Lora, Georgia, serif" font-size="28" font-weight="600" fill="#059669">Arsitektur Jamstack dan Astro</text>
  <text x="80" y="305" font-family="Inter, sans-serif" font-size="17" fill="#57534E">Mencapai Nilai Sempurna Core Web Vitals 100 Melalui</text>
  <text x="80" y="335" font-family="Inter, sans-serif" font-size="17" fill="#57534E">Zero-JS Islands Architecture dan Distribusi Edge CDN</text>
  
  <!-- Illustration Badge Card (strictly bounded to x=770..1080) -->
  <g transform="translate(770, 105)">
    <rect width="310" height="320" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5" />
    
    <!-- Lighthouse Dial -->
    <circle cx="155" cy="100" r="58" fill="#FFFFFF" stroke="#10B981" stroke-width="6" />
    <text x="155" y="105" font-family="Lora, Georgia, serif" font-size="44" font-weight="700" fill="#065F46" text-anchor="middle">100</text>
    <text x="155" y="125" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle" letter-spacing="1">LIGHTHOUSE</text>
    
    <!-- Core Web Vitals Metrics Pills -->
    <rect x="25" y="180" width="260" height="32" rx="6" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1" />
    <text x="38" y="201" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#065F46">LCP (Render Kecepatan)</text>
    <text x="272" y="201" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#059669" text-anchor="end">0.62 s</text>
    
    <rect x="25" y="220" width="260" height="32" rx="6" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1" />
    <text x="38" y="241" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#065F46">CLS (Stabilitas Visual)</text>
    <text x="272" y="241" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#059669" text-anchor="end">0.00</text>
    
    <rect x="25" y="260" width="260" height="32" rx="6" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1" />
    <text x="38" y="281" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#065F46">INP (Responsivitas Interaksi)</text>
    <text x="272" y="281" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#059669" text-anchor="end">&lt; 50 ms</text>
  </g>
  
  <!-- Bottom Bar -->
  <line x1="80" y1="470" x2="1100" y2="470" stroke="#E8E5DF" stroke-width="2" />
  <text x="80" y="520" font-family="Inter, sans-serif" font-size="16" fill="#78716C">MAS-AGUS Knowledge Hub • Agus Sifaunajah</text>
  <text x="1100" y="520" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#059669" text-anchor="end">agus1991.github.io</text>
</svg>