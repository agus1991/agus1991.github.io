    <text x="85" y="68" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONTROLLER</text>
    
    <path d="M135 62 L175 62 L175 115 L200 115" fill="none" stroke="#0284C7" stroke-width="2" />
    
    <rect x="200" y="90" width="85" height="45" rx="6" fill="#0369A1" />
    <text x="242" y="118" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MODEL</text>
    
    <path d="M85 85 L85 155 L175 155 L175 180" fill="none" stroke="#0284C7" stroke-width="2" />
    
    <rect x="135" y="180" width="85" height="45" rx="6" fill="#38BDF8" />
    <text x="177" y="208" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0C4A6E" text-anchor="middle">VIEW</text>
    
