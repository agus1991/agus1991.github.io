      <stop offset="0%" stop-color="#F8F7F4" />
      <stop offset="100%" stop-color="#EBE7DE" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgYii)" />
  <rect x="40" y="40" width="1120" height="550" rx="12" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="2" />
  
  <!-- Category Badge -->
  <rect x="80" y="85" width="260" height="34" rx="17" fill="#F4EFE6" stroke="#0284C7" stroke-width="1.5" />
  <text x="210" y="107" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0284C7" text-anchor="middle" letter-spacing="1">TUTORIAL &amp; SOFTWARE DEV</text>
  
  <!-- Title & Subtitle (bounded to x=80..680) -->
  <text x="80" y="190" font-family="Lora, Georgia, serif" font-size="42" font-weight="700" fill="#1C1917">Tutorial CRUD Yii 2</text>
  <text x="80" y="245" font-family="Lora, Georgia, serif" font-size="28" font-weight="600" fill="#0369A1">Panduan Praktisi: Dari Skema Basis Data ke Gii</text>
  <text x="80" y="305" font-family="Inter, sans-serif" font-size="17" fill="#57534E">Eksplorasi Arsitektur MVC, Active Record, Validasi Model,</text>
  <text x="80" y="335" font-family="Inter, sans-serif" font-size="17" fill="#57534E">dan Best Practices Keamanan Bawaan Framework</text>
  
  <!-- Illustration Badge Card (x=770..1080) -->
  <g transform="translate(770, 110)">
    <rect width="310" height="310" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" />
    
