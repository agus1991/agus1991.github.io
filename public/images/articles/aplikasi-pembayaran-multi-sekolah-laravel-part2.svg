<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#04121F"/>
    </linearGradient>

    <!-- Emerald / Laravel Red Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="greenGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#greenGlow)"/>

  <!-- Left Column: Title & Text Content (Strictly bounded x=80..600) -->
  <g id="text-content">
    <!-- Category Badge -->
    <rect x="80" y="85" width="220" height="32" rx="16" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-opacity="0.6" stroke-width="1"/>
    <text x="190" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle" letter-spacing="1.2">TUTORIAL BERSERI • BAGIAN 2</text>

    <!-- Main Title (Strictly bounded) -->
    <text x="80" y="175" font-family="'Georgia', serif" font-size="35" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">Aplikasi Pembayaran Multi-Sekolah</text>

    <!-- Subtitle Line 1 (max 35 chars, <= 600px) -->
    <text x="80" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">Migrasi Skema, Model Eloquent</text>

    <!-- Subtitle Line 2 (max 35 chars, <= 600px) -->
    <text x="80" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">Dan Multi-Tenant Global Scope</text>

    <!-- Divider Line -->
    <line x1="80" y1="315" x2="520" y2="315" stroke="#334155" stroke-width="1.5"/>

    <!-- Metadata Section -->
    <text x="80" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Agus Sifaunajah (MAS-AGUS)</text>
    <text x="80" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#64748B">Rekayasa Perangkat Lunak, Arsitektur Multi-Tenant &amp; Laravel 11/12</text>

    <!-- Tags Row -->
    <g transform="translate(80, 520)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="85" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="42" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Laravel</text>

      <!-- Tag 2 -->
      <rect x="95" y="0" width="95" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="142" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Eloquent</text>

      <!-- Tag 3 -->
      <rect x="200" y="0" width="115" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="257" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Global Scope</text>

      <!-- Tag 4 -->
      <rect x="325" y="0" width="115" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="382" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Tenant Trait</text>
    </g>
  </g>

  <!-- Right Column: Visual Architecture Card (Placed at translate(800, 105)) -->
  <g transform="translate(800, 105)">
    <!-- Main Card Body -->
    <rect width="300" height="420" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5"/>

    <!-- Card Header / Title -->
    <rect x="20" y="20" width="260" height="36" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="150" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">TENANT ISOLATION PIPELINE</text>

    <!-- Step 1: Session Context & Middleware -->
    <g transform="translate(25, 75)">
      <rect width="250" height="65" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
      <text x="125" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle">1. SetTenantContext Middleware</text>
      <text x="125" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#D1FAE5" text-anchor="middle">Injeksi Session • app(TenantManager)</text>
    </g>

    <!-- Connector Arrow -->
    <path d="M 150 140 L 150 165" stroke="#10B981" stroke-width="2" stroke-dasharray="3"/>

    <!-- Step 2: BelongsToSchool Trait & Scope -->
    <g transform="translate(25, 165)">
      <rect width="250" height="75" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="125" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">2. Trait BelongsToSchool</text>
      <text x="125" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38BDF8" text-anchor="middle">booted() • addGlobalScope()</text>
      <text x="125" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Auto-fill school_id on creating</text>
    </g>

    <!-- Connector Arrow -->
    <path d="M 150 240 L 150 265" stroke="#10B981" stroke-width="2" stroke-dasharray="3"/>

    <!-- Step 3: SQL Generation -->
    <g transform="translate(25, 265)">
      <rect width="250" height="130" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="125" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">3. Eksekusi Kueri Aman</text>
      <line x1="20" y1="36" x2="230" y2="36" stroke="#334155" stroke-width="1"/>
      
      <text x="25" y="58" font-family="monospace" font-size="11" fill="#E2E8F0">SELECT * FROM bills</text>
      <text x="25" y="78" font-family="monospace" font-size="11" fill="#34D399">WHERE school_id = 2</text>
      <text x="25" y="98" font-family="monospace" font-size="10" fill="#94A3B8">AND status = 'unpaid'</text>
      
      <rect x="25" y="112" width="200" height="1" fill="#10B981" fill-opacity="0.3"/>
    </g>
  </g>
</svg>
