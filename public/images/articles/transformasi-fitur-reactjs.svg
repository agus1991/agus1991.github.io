<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#051329"/>
    </linearGradient>

    <!-- React Cyan Gradient -->
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#00D8FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D8FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="cyanGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00D8FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>

  <!-- Left Column: Title & Text Content (Strictly bounded x=80..600) -->
  <g id="text-content">
    <!-- Category Badge -->
    <rect x="80" y="85" width="180" height="32" rx="16" fill="#0284C7" fill-opacity="0.2" stroke="#00D8FF" stroke-opacity="0.6" stroke-width="1"/>
    <text x="170" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1.5">FRONTEND ECOSYSTEM</text>

    <!-- Main Title (Strictly bounded) -->
    <text x="80" y="175" font-family="'Georgia', serif" font-size="38" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">Evolusi Framework React</text>

    <!-- Subtitle Line 1 (max 35 chars, <= 600px) -->
    <text x="80" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">Dari Inovasi Virtual DOM Hingga</text>

    <!-- Subtitle Line 2 (max 35 chars, <= 600px) -->
    <text x="80" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">Arsitektur Server Components</text>

    <!-- Divider Line -->
    <line x1="80" y1="315" x2="520" y2="315" stroke="#334155" stroke-width="1.5"/>

    <!-- Metadata Section -->
    <text x="80" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Agus Sifaunajah (MAS-AGUS)</text>
    <text x="80" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#64748B">Kajian Kepakaran Praktisi &amp; Arsitektur Antarmuka Modern</text>

    <!-- Tags Row -->
    <g transform="translate(80, 520)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="85" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="42" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">React</text>

      <!-- Tag 2 -->
      <rect x="95" y="0" width="85" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="137" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Hooks</text>

      <!-- Tag 3 -->
      <rect x="190" y="0" width="135" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="257" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Server Actions</text>

      <!-- Tag 4 -->
      <rect x="335" y="0" width="100" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="385" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Next.js</text>
    </g>
  </g>

  <!-- Right Column: Visual Architecture Card (Placed at translate(800, 105)) -->
  <g transform="translate(800, 105)">
    <!-- Main Card Body -->
    <rect width="300" height="420" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5"/>

    <!-- Card Header / Title -->
    <rect x="20" y="20" width="260" height="36" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="150" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">REACT REVOLUTION</text>

    <!-- React Atom Icon Graphic -->
    <g transform="translate(150, 115)">
      <!-- Nucleus -->
      <circle cx="0" cy="0" r="10" fill="url(#reactGrad)"/>
      <!-- Orbit 1 -->
      <ellipse cx="0" cy="0" rx="42" ry="16" fill="none" stroke="#00D8FF" stroke-width="2.5" opacity="0.85"/>
      <!-- Orbit 2 -->
      <ellipse cx="0" cy="0" rx="42" ry="16" fill="none" stroke="#00D8FF" stroke-width="2.5" opacity="0.85" transform="rotate(60)"/>
      <!-- Orbit 3 -->
      <ellipse cx="0" cy="0" rx="42" ry="16" fill="none" stroke="#00D8FF" stroke-width="2.5" opacity="0.85" transform="rotate(120)"/>
    </g>

    <!-- Phase 1: Virtual DOM & JSX -->
    <g transform="translate(25, 185)">
      <rect width="250" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="30" r="12" fill="#64748B" fill-opacity="0.2"/>
      <text x="24" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">v0</text>
      <text x="48" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Era Deklaratif (2013)</text>
      <text x="48" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Virtual DOM, JSX &amp; Class</text>
    </g>

    <!-- Phase 2: Hooks Revolution -->
    <g transform="translate(25, 258)">
      <rect width="250" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="30" r="12" fill="#0284C7" fill-opacity="0.2"/>
      <text x="24" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">v16</text>
      <text x="48" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Revolusi Hooks (v16.8)</text>
      <text x="48" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">useState, useEffect &amp; Custom</text>
    </g>

    <!-- Phase 3: Server Components & React 19 -->
    <g transform="translate(25, 331)">
      <rect width="250" height="65" rx="8" fill="#1E293B" stroke="#00D8FF" stroke-width="1.5"/>
      <circle cx="24" cy="32" r="12" fill="#00D8FF" fill-opacity="0.2"/>
      <text x="24" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">v19</text>
      <text x="48" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">RSC &amp; React Compiler</text>
      <text x="48" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E2E8F0">Server Actions, use &amp; Zero-JS</text>
    </g>
  </g>
</svg>
