<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left Column: Editorial Information (x=80 to x=600) -->
  <g transform="translate(80, 0)">
    <!-- Series Badge -->
    <g transform="translate(0, 110)">
      <rect width="275" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="5" fill="#38bdf8"/>
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1.2">
        LARAVEL ARCHITECTURE • PART 5
      </text>
    </g>

    <!-- Main Title (2 Lines) -->
    <text x="0" y="195" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      Arsitektur RESTful API,
    </text>
    <text x="0" y="242" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" fill="#38bdf8" letter-spacing="-0.5">
      Sanctum &amp; Integrasi Mobile
    </text>

    <!-- Subtitle (2 Lines) -->
    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Ekspose layanan pembayaran multi-sekolah secara
    </text>
    <text x="0" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      stateless melalui Bearer Token &amp; API Resources.
    </text>

    <!-- Meta Information Pills -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">
        Laravel 11+
      </text>

      <rect x="115" y="0" width="115" height="26" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
      <text x="127" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#93c5fd">
        RESTful API
      </text>

      <rect x="240" y="0" width="115" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="252" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">
        Sanctum Auth
      </text>

      <rect x="365" y="0" width="130" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
      <text x="377" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">
        JSON Resources
      </text>
    </g>

    <!-- Author & Reading Meta -->
    <g transform="translate(0, 425)">
      <circle cx="18" cy="18" r="18" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="12" y="23" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#38bdf8">A</text>
      
      <text x="46" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">
        Agus Sifaunajah, M.Kom.
      </text>
      <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">
        Sistem Informasi &amp; Rekayasa Perangkat Lunak • 20 Menit Baca
      </text>
    </g>

    <!-- Episode Highlight Footer -->
    <g transform="translate(0, 485)">
      <rect width="495" height="42" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">
        Ekspansi Ekosistem: Dari Web Monolitik ke Layanan Terdistribusi
      </text>
      <text x="462" y="26" font-family="sans-serif" font-size="14" fill="#38bdf8">→</text>
    </g>
  </g>

  <!-- Right Column: REST API Gateway Card (translate(780, 105), w=340, h=420) -->
  <g transform="translate(780, 105)" filter="url(#cardShadow)">
    <rect width="340" height="420" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Header Terminal Bar -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 324 0 C 332.84 0 340 7.16 340 16 L 340 46 L 0 46 Z" fill="#0f172a"/>
    <circle cx="20" cy="23" r="5" fill="#ef4444"/>
    <circle cx="36" cy="23" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="23" r="5" fill="#10b981"/>
    <text x="76" y="27" font-family="monospace" font-size="11" font-weight="700" fill="#94a3b8">
      API GATEWAY • /api/v1
    </text>

    <!-- Endpoint 1: POST /login -->
    <g transform="translate(18, 62)">
      <rect width="304" height="58" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="12" y="12" width="46" height="20" rx="4" fill="#2563eb" fill-opacity="0.25"/>
      <text x="20" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#60a5fa">POST</text>
      <text x="68" y="26" font-family="monospace" font-size="11" font-weight="700" fill="#e2e8f0">/v1/auth/token</text>
      <text x="12" y="46" font-family="monospace" font-size="10" fill="#94a3b8">Sanctum Bearer + Tenant Scope</text>
    </g>

    <!-- Endpoint 2: GET /bills -->
    <g transform="translate(18, 132)">
      <rect width="304" height="58" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="12" y="12" width="46" height="20" rx="4" fill="#059669" fill-opacity="0.25"/>
      <text x="24" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">GET</text>
      <text x="68" y="26" font-family="monospace" font-size="11" font-weight="700" fill="#e2e8f0">/v1/students/{nis}/bills</text>
      <text x="12" y="46" font-family="monospace" font-size="10" fill="#94a3b8">200 OK • BillResource Collection</text>
    </g>

    <!-- Endpoint 3: POST /payments -->
    <g transform="translate(18, 202)">
      <rect width="304" height="58" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="12" y="12" width="46" height="20" rx="4" fill="#d97706" fill-opacity="0.25"/>
      <text x="20" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#fbbf24">POST</text>
      <text x="68" y="26" font-family="monospace" font-size="11" font-weight="700" fill="#e2e8f0">/v1/payments</text>
      <text x="12" y="46" font-family="monospace" font-size="10" fill="#94a3b8">201 Created • ACID lockForUpdate</text>
    </g>

    <!-- JSON Response Preview -->
    <g transform="translate(18, 276)">
      <rect width="304" height="122" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="monospace" font-size="10" fill="#64748b">{</text>
      <text x="24" y="40" font-family="monospace" font-size="10" fill="#38bdf8">"status"</text>
      <text x="78" y="40" font-family="monospace" font-size="10" fill="#94a3b8">: </text>
      <text x="90" y="40" font-family="monospace" font-size="10" fill="#10b981">"success"</text>
      <text x="150" y="40" font-family="monospace" font-size="10" fill="#94a3b8">,</text>
      <text x="24" y="58" font-family="monospace" font-size="10" fill="#38bdf8">"receipt"</text>
      <text x="84" y="58" font-family="monospace" font-size="10" fill="#94a3b8">: </text>
      <text x="96" y="58" font-family="monospace" font-size="10" fill="#fbbf24">"KWT/SMP-IT/202611/0042"</text>
      <text x="260" y="58" font-family="monospace" font-size="10" fill="#94a3b8">,</text>
      <text x="24" y="76" font-family="monospace" font-size="10" fill="#38bdf8">"tenant"</text>
      <text x="78" y="76" font-family="monospace" font-size="10" fill="#94a3b8">: </text>
      <text x="90" y="76" font-family="monospace" font-size="10" fill="#c4b5fd">"SMP-IT"</text>
      <text x="145" y="76" font-family="monospace" font-size="10" fill="#94a3b8">,</text>
      <text x="24" y="94" font-family="monospace" font-size="10" fill="#38bdf8">"total"</text>
      <text x="72" y="94" font-family="monospace" font-size="10" fill="#94a3b8">: </text>
      <text x="84" y="94" font-family="monospace" font-size="10" fill="#f8fafc">600000.00</text>
      <text x="12" y="112" font-family="monospace" font-size="10" fill="#64748b">}</text>
    </g>
  </g>
</svg>