<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgF7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
    <linearGradient id="f7BrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE350F" />
      <stop offset="100%" stop-color="#C02607" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgF7)" />
  <rect x="40" y="40" width="1120" height="550" rx="12" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="2" />
  
  <!-- Category Badge -->
  <rect x="80" y="85" width="280" height="34" rx="17" fill="#FEF2F2" stroke="#EE350F" stroke-width="1.5" />
  <text x="220" y="107" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle" letter-spacing="1">MOBILE &amp; WEB ENGINEERING</text>
  
  <!-- Title & Subtitle (bounded to x=80..680) -->
  <text x="80" y="190" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#1C1917">Mengenal Framework7</text>
  <text x="80" y="245" font-family="Lora, Georgia, serif" font-size="25" font-weight="600" fill="#C02607">Aplikasi Mobile Hibrida &amp; PWA Berbasis Standar Web</text>
  <text x="80" y="305" font-family="Inter, sans-serif" font-size="17" fill="#57534E">Eksplorasi Antarmuka Native iOS &amp; Android Material,</text>
  <text x="80" y="335" font-family="Inter, sans-serif" font-size="17" fill="#57534E">Arsitektur Dom7, Sinergi REST API, dan Solusi Empiris Lapangan</text>
  
  <!-- Illustration Badge Card (x=770..1080) -->
  <g transform="translate(770, 105)">
    <rect width="310" height="325" rx="10" fill="#FFFDFD" stroke="#FECACA" stroke-width="1.5" />
    
    <!-- Phone Frame Illustration -->
