<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left Column: Editorial Information (x=80 to x=600) -->
  <g transform="translate(80, 0)">
    <!-- Series Badge -->
    <g transform="translate(0, 110)">
      <rect width="270" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="5" fill="#38bdf8"/>
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1.2">
        LARAVEL ARCHITECTURE • PART 4
      </text>
    </g>

    <!-- Main Title (2 Lines, strictly < 600px width) -->
    <text x="0" y="195" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      Kuitansi PDF, WhatsApp Gateway,
    </text>
    <text x="0" y="242" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800" fill="#38bdf8" letter-spacing="-0.5">
      &amp; Dasbor Keuangan Yayasan
    </text>

    <!-- Subtitle (2 Lines) -->
    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Otomasi kuitansi PDF resmi, notifikasi WA via
    </text>
    <text x="0" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Job Queue, &amp; dasbor analitik multi-unit real-time.
    </text>

    <!-- Meta Information Pills -->
    <g transform="translate(0, 365)">
      <!-- Framework Badge -->
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
      <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">
        Laravel 11+
      </text>

      <!-- Module 1: DomPDF -->
      <rect x="115" y="0" width="115" height="26" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
      <text x="127" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#93c5fd">
        DomPDF &amp; QR
      </text>

      <!-- Module 2: WA Queue -->
      <rect x="240" y="0" width="125" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="252" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">
        WA Queue Job
      </text>

      <!-- Module 3: Executive Dashboard -->
      <rect x="375" y="0" width="130" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
      <text x="387" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">
        Exec Dashboard
      </text>
    </g>

    <!-- Author & Reading Meta -->
    <g transform="translate(0, 425)">
      <circle cx="18" cy="18" r="18" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="12" y="23" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#38bdf8">A</text>
      
      <text x="46" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">
        Agus Sifaunajah, M.Kom.
      </text>
      <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">
        Sistem Informasi &amp; Rekayasa Perangkat Lunak • 22 Menit Baca
      </text>
    </g>

    <!-- Episode Highlight Footer -->
    <g transform="translate(0, 485)">
      <rect width="480" height="42" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">
        Fase Pemungkas: Dari Struk Digital Hingga Dasbor Yayasan
      </text>
      <text x="445" y="26" font-family="sans-serif" font-size="14" fill="#38bdf8">→</text>
    </g>
  </g>

  <!-- Right Column: System Graphic Card (translate(800, 105), w=320, h=420) -->
  <g transform="translate(800, 105)" filter="url(#cardShadow)">
    <!-- Base Card Background -->
    <rect width="320" height="420" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Header Terminal Bar -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 304 0 C 312.84 0 320 7.16 320 16 L 320 46 L 0 46 Z" fill="#0f172a"/>
    <circle cx="20" cy="23" r="5" fill="#ef4444"/>
    <circle cx="36" cy="23" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="23" r="5" fill="#10b981"/>
    <text x="76" y="27" font-family="monospace" font-size="11" font-weight="700" fill="#94a3b8">
      YAYASAN EXEC MONITOR
    </text>

    <!-- Card Section 1: Aggregate Foundation Cash -->
    <g transform="translate(18, 62)">
      <rect width="284" height="64" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.8">
        TOTAL KAS TERSERAP (SEMUA UNIT)
      </text>
      <text x="14" y="48" font-family="monospace" font-size="18" font-weight="800" fill="#38bdf8">
        Rp 482.650.000
      </text>
      <text x="210" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#10b981">
        +14.2% ↑
      </text>
    </g>

    <!-- Card Section 2: Unit Performance Breakdown -->
    <g transform="translate(18, 138)">
      <text x="2" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">
        REKAPITULASI REALISASI UNIT
      </text>

      <!-- SMA Unit -->
      <g transform="translate(0, 22)">
        <rect width="284" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">SMA IT</text>
        <text x="140" y="21" font-family="monospace" font-size="11" fill="#cbd5e1">Rp 195.400.000</text>
        <rect x="240" y="11" width="34" height="14" rx="3" fill="#10b981" fill-opacity="0.2"/>
        <text x="244" y="22" font-family="monospace" font-size="9" font-weight="700" fill="#6ee7b7">92%</text>
      </g>

      <!-- SMP Unit -->
      <g transform="translate(0, 62)">
        <rect width="284" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">SMP IT</text>
        <text x="140" y="21" font-family="monospace" font-size="11" fill="#cbd5e1">Rp 162.800.000</text>
        <rect x="240" y="11" width="34" height="14" rx="3" fill="#10b981" fill-opacity="0.2"/>
        <text x="244" y="22" font-family="monospace" font-size="9" font-weight="700" fill="#6ee7b7">88%</text>
      </g>

      <!-- SD Unit -->
      <g transform="translate(0, 102)">
        <rect width="284" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">SD IT</text>
        <text x="140" y="21" font-family="monospace" font-size="11" fill="#cbd5e1">Rp 124.450.000</text>
        <rect x="240" y="11" width="34" height="14" rx="3" fill="#f59e0b" fill-opacity="0.2"/>
        <text x="244" y="22" font-family="monospace" font-size="9" font-weight="700" fill="#fcd34d">79%</text>
      </g>
    </g>

    <!-- Card Section 3: PDF Receipt & WhatsApp Gateway Telemetry -->
    <g transform="translate(18, 292)">
      <!-- PDF Module status -->
      <rect width="284" height="48" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <circle cx="20" cy="24" r="8" fill="#ef4444" fill-opacity="0.2"/>
      <text x="16" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ef4444">PDF</text>
      <text x="36" y="20" font-family="monospace" font-size="10" font-weight="700" fill="#f8fafc">
        KWT/SMP-IT/202611/0001
      </text>
      <text x="36" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8">
        DomPDF Rendered • QR Hash Verified
      </text>
      <circle cx="264" cy="24" r="4" fill="#10b981"/>

      <!-- WhatsApp Gateway status -->
      <g transform="translate(0, 56)">
        <rect width="284" height="48" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.5"/>
        <circle cx="20" cy="24" r="8" fill="#10b981" fill-opacity="0.2"/>
        <text x="16" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981">WA</text>
        <text x="36" y="20" font-family="monospace" font-size="10" font-weight="700" fill="#f8fafc">
          SendPaymentReceiptNotification
        </text>
        <text x="36" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#6ee7b7">
          Async Job Dispatched • 08123456789
        </text>
        <circle cx="264" cy="24" r="4" fill="#38bdf8"/>
      </g>
    </g>
  </g>
</svg>
