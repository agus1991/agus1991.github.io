<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F7F4" />
      <stop offset="100%" stop-color="#EFECE6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgAI)" />
  <rect x="40" y="40" width="1120" height="550" rx="12" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="2" />
  
  <!-- Category Badge -->
  <rect x="80" y="85" width="220" height="34" rx="17" fill="#F4EFE6" stroke="#B45309" stroke-width="1.5" />
  <text x="190" y="107" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="1">OPINI &amp; PENDIDIKAN TI</text>
  
  <!-- Title (Compact & Elegant) -->
  <text x="80" y="185" font-family="Lora, Georgia, serif" font-size="40" font-weight="700" fill="#1C1917">Mendidik di Era AI</text>
  
  <!-- Subtitle (Two-line structured to guarantee no overlap with card at x=800) -->
  <text x="80" y="238" font-family="Lora, Georgia, serif" font-size="24" font-weight="600" fill="#B45309">Tantangan Dosen TI Menghadapi</text>
  <text x="80" y="272" font-family="Lora, Georgia, serif" font-size="24" font-weight="600" fill="#B45309">Disrupsi Kecerdasan Artifisial</text>
  
  <!-- Description (Bounded to max x=600) -->
  <text x="80" y="325" font-family="Inter, sans-serif" font-size="16" fill="#57534E">Refleksi Kritis: Dari Menghafal Sintaks Menuju</text>
  <text x="80" y="352" font-family="Inter, sans-serif" font-size="16" fill="#57534E">Arsitektur Logika, Integritas, dan Uji Lapangan</text>
  
  <!-- Illustration Badge Card (Strictly placed at x=800..1100, safe margin >250px) -->
  <g transform="translate(800, 105)">
    <rect width="300" height="320" rx="10" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="1.5" />
    
    <!-- Brain & Logic Node Graphic -->
    <circle cx="150" cy="115" r="55" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5" />
    
    <!-- Code prompt symbol vs Human thought -->
    <path d="M120 105 L135 120 L120 135" stroke="#B45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="143" y1="135" x2="160" y2="135" stroke="#B45309" stroke-width="3" stroke-linecap="round" />
    
    <circle cx="165" cy="100" r="5" fill="#B45309" />
    <circle cx="180" cy="115" r="4" fill="#D97706" />
    <line x1="165" y1="105" x2="180" y2="115" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3,2" />
    
    <text x="150" y="225" font-family="Lora, Georgia, serif" font-size="16" font-weight="700" fill="#1C1917" text-anchor="middle">Beyond Auto-Generated Code</text>
    <text x="150" y="255" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#B45309" text-anchor="middle">Critical Thinking • Architecture</text>
    <text x="150" y="278" font-family="Inter, sans-serif" font-size="11" fill="#78716C" text-anchor="middle">Empirical Problem Solving</text>
  </g>
  
  <!-- Bottom Bar -->
  <line x1="80" y1="470" x2="1100" y2="470" stroke="#E8E5DF" stroke-width="2" />
  <text x="80" y="520" font-family="Inter, sans-serif" font-size="16" fill="#78716C">MAS-AGUS Knowledge Hub • Agus Sifaunajah</text>
  <text x="1100" y="520" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#B45309" text-anchor="end">agus1991.github.io</text>
</svg>